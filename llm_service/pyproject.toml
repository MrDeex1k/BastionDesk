[project]
name = "llm-service"
version = "1.0.3"
description = "Serwer LLM, do analizy incydentów"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "grpcio==1.83.1",
    "grpcio-tools==1.83.1",
    "huggingface-hub==1.30.0",
    "torch==2.14.0",
    "transformers==5.16.1",
    "uvicorn==0.52.4",
]

[tool.uv]
exclude-newer = "24 hours"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
