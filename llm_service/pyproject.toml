[project]
name = "llm-service"
version = "1.0.3"
description = "Serwer LLM, do analizy incydentów"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "grpcio==1.85.0",
    "grpcio-tools==1.85.0",
    "huggingface-hub==2.4.0",
    "torch==2.15.0",
    "transformers==5.22.1",
    "uvicorn==0.54.0",
]

[tool.uv]
exclude-newer = "3 hours"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
