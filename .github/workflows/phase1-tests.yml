name: UI and migration contract

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: Run Chromium, Firefox and WebKit checkpoint
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Test-only backend configuration
        run: cp .env.example .env
      - run: bun run check
      - run: bun run test
      - name: Verify frontend test isolation in different orders
        run: bun run --cwd frontend test:order
      - run: bun run build

  browser-contract:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install browsers and OS libraries
        working-directory: frontend
        run: bun x --no-install playwright install --with-deps chromium firefox webkit
      - name: Run migration contract on an isolated Compose stack
        env:
          FULL_MATRIX: ${{ inputs.full_browser_matrix || startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$FULL_MATRIX" = "true" ]; then
            bun run test:e2e:all
          else
            bun run test:e2e
          fi
      - name: Prepare public browser summary
        if: always()
        run: bun run --cwd frontend test:e2e:report
      - name: Preserve sanitized browser summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-browser-contract-public
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/phase1-public/results.json
            artifacts/phase1-public/index.html
