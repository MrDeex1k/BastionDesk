services:
  database:
    build:
      context: ./database
    container_name: bastiondesk-postgres
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    command: ["postgres", "-c", "port=${POSTGRES_PORT}"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-sql:/docker-entrypoint-initdb.d
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 4s
      timeout: 4s
      retries: 5

  llm_service:
    build:
      context: ./llm_service
    env_file:
      - .env
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    networks:
      - bastiondesk-net-internal
      - bastiondesk-net-external
    deploy:
      resources:
        limits:
          memory: 12GB

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      storage-1:
        condition: service_healthy
      storage-3:
        condition: service_healthy
    command: ["bun", "run", "start"]
    ports:
      - "3333:3333"
    networks:
      - bastiondesk-net-internal

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    networks:
      - bastiondesk-net-external

  nginx:
    build:
      context: ./nginx
    container_name: bastiondesk-nginx
    ports:
      - "4567:4567"
    depends_on:
      backend:
        condition: service_started
    networks:
      - bastiondesk-net-internal
      - bastiondesk-net-external

  storage-1:
    build:
      context: ./storage
    container_name: bastiondesk-storage-1
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=true
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/backups/postgres
        minio server --address :9000 --console-address :9001 \
          http://storage-1:9000/data \
          http://storage-2:9000/data \
          http://storage-3:9000/data \
          http://storage-4:9000/data &
        pid=$!
        for i in $(seq 1 20); do
          wget --spider --quiet http://localhost:9000/minio/health/ready && break
          sleep 2
        done
        if [ "$${BOOTSTRAP_NODE:-false}" = "true" ]; then
          mc alias set minio http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
          mc mb --ignore-existing minio/"$${S3_BUCKET}"
          mc version enable minio/"$${S3_BUCKET}" || true
        fi
        wait $pid
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data-1:/data
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-2:
    build:
      context: ./storage
    container_name: bastiondesk-storage-2
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=false
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/backups/postgres
        minio server --address :9000 --console-address :9001 \
          http://storage-1:9000/data \
          http://storage-2:9000/data \
          http://storage-3:9000/data \
          http://storage-4:9000/data &
        pid=$!
        for i in $(seq 1 20); do
          wget --spider --quiet http://localhost:9000/minio/health/ready && break
          sleep 2
        done
        wait $pid
    volumes:
      - minio-data-2:/data
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-3:
    build:
      context: ./storage
    container_name: bastiondesk-storage-3
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=false
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/backups/postgres
        minio server --address :9000 --console-address :9001 \
          http://storage-1:9000/data \
          http://storage-2:9000/data \
          http://storage-3:9000/data \
          http://storage-4:9000/data &
        pid=$!
        for i in $(seq 1 20); do
          wget --spider --quiet http://localhost:9000/minio/health/ready && break
          sleep 2
        done
        wait $pid
    volumes:
      - minio-data-3:/data
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-4:
    build:
      context: ./storage
    container_name: bastiondesk-storage-4
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=false
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/backups/postgres
        minio server --address :9000 --console-address :9001 \
          http://storage-1:9000/data \
          http://storage-2:9000/data \
          http://storage-3:9000/data \
          http://storage-4:9000/data &
        pid=$!
        for i in $(seq 1 20); do
          wget --spider --quiet http://localhost:9000/minio/health/ready && break
          sleep 2
        done
        wait $pid
    volumes:
      - minio-data-4:/data
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local
  huggingface-cache:
    driver: local
  minio-data-1:
    driver: local
  minio-data-2:
    driver: local
  minio-data-3:
    driver: local
  minio-data-4:
    driver: local

networks:
  bastiondesk-net-internal:
    driver: bridge
  bastiondesk-net-external:
    driver: bridge
