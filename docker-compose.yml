services:
  database:
    build:
      context: ./database
    container_name: bastiondesk-postgres
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
        "-c",
        "port=${POSTGRES_PORT}"
      ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-sql:/docker-entrypoint-initdb.d
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/tls/dev/ca:/certs/ca:ro
      - ./infra/tls/dev/database:/certs/database:ro
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 4s
      timeout: 4s
      retries: 5

  llm_service:
    build:
      context: .
      dockerfile: llm_service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,llm_service,backend,pgbouncer,database,storage-1,storage-2,storage-3,storage-4}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,llm_service,backend,pgbouncer,database,storage-1,storage-2,storage-3,storage-4}
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
      - ./infra/tls/dev/ca:/certs/ca:ro
      - ./infra/tls/dev/llm_service:/certs/llm_service:ro
    networks:
      - bastiondesk-net-internal
    deploy:
      resources:
        limits:
          memory: 10GB

  pgbouncer:
    build:
      context: ./pgbouncer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./infra/tls/dev/ca:/certs/ca:ro
      - ./infra/tls/dev/pgbouncer:/certs/pgbouncer:ro
    networks:
      - bastiondesk-net-internal

  postgres-backup:
    build:
      context: .
      dockerfile: postgres_backup/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - DB_TLS_CERT_PATH=/certs/db-client/client.crt
      - DB_TLS_KEY_PATH=/certs/db-client/client.key
      - BACKUP_CRON=0 3 * * *
      - BACKUP_RUN_ON_START=true
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_S3_PREFIX=postgres/daily
      - BACKUP_MAX_AGE_SECONDS=129600
      - BACKUP_STATE_DIR=/state
    depends_on:
      database:
        condition: service_healthy
      storage-1:
        condition: service_healthy
    volumes:
      - ./infra/tls/dev/ca:/certs/ca:ro
      - ./infra/tls/dev/pgbouncer:/certs/db-client:ro
      - postgres-backup-state:/state
    networks:
      - bastiondesk-net-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/ca/ca.crt
      - SSL_CERT_FILE=/certs/ca/ca.crt
    depends_on:
      llm_service:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      storage-1:
        condition: service_healthy
      storage-3:
        condition: service_healthy
    volumes:
      - ./infra/tls/dev/ca:/certs/ca:ro
      - ./infra/tls/dev/backend:/certs/backend:ro
    networks:
      - bastiondesk-net-internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - bastiondesk-net-external

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    container_name: bastiondesk-nginx
    ports:
      - "4567:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - bastiondesk-net-internal
      - bastiondesk-net-external

  storage-1:
    build:
      context: ./storage
    container_name: bastiondesk-storage-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=true
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/backups/postgres
        mkdir -p /root/.mc/certs/CAs
        cp -f /root/.minio/certs/CAs/* /root/.mc/certs/CAs/ 2>/dev/null || true
        export MC_CERTS_DIR=/root/.mc/certs
        export SSL_CERT_FILE=/root/.mc/certs/CAs/ca.crt
        minio server --address :9000 --console-address :9001 https://storage-1:9000/data https://storage-2:9000/data https://storage-3:9000/data https://storage-4:9000/data &
        #Podman
        #minio server --address :9000 --console-address :9001 /data &
        pid=$$!
        for i in $(seq 1 20); do
          wget --spider --quiet --no-check-certificate https://localhost:9000/minio/health/ready && break
          sleep 2
        done
        if [ "$${BOOTSTRAP_NODE}" = "true" ]; then
          mc alias set minio https://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
          mc mb --ignore-existing minio/"$${S3_BUCKET}"
          mc version enable minio/"$${S3_BUCKET}" || true
          sleep 5  # Czekaj na synchronizację bucketa w distributed MinIO
        fi
        wait $$pid
    volumes:
      - minio-data-1:/data
      - ./infra/tls/dev/storage-1:/root/.minio/certs:ro
    networks:
      - bastiondesk-net-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--no-check-certificate", "https://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  storage-2:
    build:
      context: ./storage
    container_name: bastiondesk-storage-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOOTSTRAP_NODE=false
