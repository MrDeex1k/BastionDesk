server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Obsługa SPA - wszystkie żądania przekieruj do index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}